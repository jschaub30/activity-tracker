# https://mise.jdx.dev/
# Install tools:  mise install
# List tasks:     mise tasks
# Run a task:     mise run <name>   (or `mise start` / `mise stop`)

[tools]
node = "24"
uv = "0.11"
terraform = "1.11"

[env]
_.file = [
  "{{config_root}}/backend/.env",
]

[settings]
experimental = true

# ---------------------------------------------------------------------------
# Setup
# ---------------------------------------------------------------------------

[tasks.install]
description = "Install backend (uv) + frontend (npm) dependencies"
run = [
  "mise run install:backend",
  "mise run install:frontend",
]

[tasks."install:backend"]
hide = true
dir = "{{config_root}}/backend"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [[ ! -f .env ]]; then
  cp .env.example .env
  echo "Created backend/.env from .env.example — set SECRET_KEY / TOKEN_ENCRYPTION_KEY"
fi
uv sync
"""

[tasks."install:frontend"]
hide = true
dir = "{{config_root}}/frontend"
run = "npm install"

# ---------------------------------------------------------------------------
# Dev servers
# ---------------------------------------------------------------------------

[tasks.start]
description = "Start backend + frontend in the background"
run = """
#!/usr/bin/env bash
set -euo pipefail
ROOT="{{config_root}}"
LOGDIR="$ROOT/.run"
mkdir -p "$LOGDIR"

already() {
  lsof -ti tcp:"$1" -sTCP:LISTEN >/dev/null 2>&1
}

start_one() {
  local name="$1" port="$2" dir="$3"
  shift 3
  if already "$port"; then
    echo "$name already running on :$port"
    return 0
  fi
  echo "Starting $name on :$port"
  # New session so the process survives after this mise task exits.
  python3 - "$dir" "$LOGDIR/${name}.log" "$@" <<'PY'
import os, subprocess, sys
os.chdir(sys.argv[1])
log = open(sys.argv[2], "ab", buffering=0)
subprocess.Popen(
    sys.argv[3:],
    stdin=subprocess.DEVNULL,
    stdout=log,
    stderr=subprocess.STDOUT,
    start_new_session=True,
    close_fds=True,
)
PY
}

mise run dynamodb
start_one backend 8010 "$ROOT/backend" \
  uv run uvicorn garmin_tracker.main:app --reload --host 127.0.0.1 --port 8010
start_one frontend 5180 "$ROOT/frontend" \
  npm run dev -- --host 127.0.0.1 --port 5180

wait_for() {
  local name="$1" port="$2"
  local i
  for i in $(seq 1 30); do
    if already "$port"; then
      echo "$name ready"
      return 0
    fi
    sleep 0.4
  done
  echo "$name failed to bind :$port — see $LOGDIR/${name}.log" >&2
  return 1
}

wait_for backend 8010
wait_for frontend 5180

echo
echo "Backend    http://127.0.0.1:8010"
echo "Frontend   http://127.0.0.1:5180"
echo "DynamoDB   http://127.0.0.1:8000 (docker garmin-tracker-ddb)"
echo "Logs       $LOGDIR/{backend,frontend}.log"
echo "Stop with: mise stop"
"""

[tasks.stop]
description = "Stop backend + frontend"
run = """
#!/usr/bin/env bash
set -euo pipefail

stop_port() {
  local port="$1"
  local name="$2"
  local pids
  pids=$(lsof -ti tcp:"$port" -sTCP:LISTEN 2>/dev/null || true)
  if [[ -z "${pids}" ]]; then
    echo "${name}: nothing listening on :${port}"
    return 0
  fi
  echo "${name}: stopping PID(s) ${pids//$'\n'/ } on :${port}"
  # shellcheck disable=SC2086
  kill ${pids} 2>/dev/null || true
  sleep 0.4
  pids=$(lsof -ti tcp:"$port" -sTCP:LISTEN 2>/dev/null || true)
  if [[ -n "${pids}" ]]; then
    echo "${name}: force kill ${pids//$'\n'/ }"
    # shellcheck disable=SC2086
    kill -9 ${pids} 2>/dev/null || true
  fi
  echo "${name}: stopped"
}

stop_port 8010 "backend"
stop_port 5180 "frontend"
if docker ps --format '{{.Names}}' 2>/dev/null | grep -q '^garmin-tracker-ddb$'; then
  docker stop garmin-tracker-ddb >/dev/null
  echo "dynamodb: stopped garmin-tracker-ddb"
fi
echo "Local dev services stopped."
"""

[tasks.backend]
description = "Start FastAPI with reload (foreground, http://127.0.0.1:8010)"
dir = "{{config_root}}/backend"
run = "uv run uvicorn garmin_tracker.main:app --reload --host 127.0.0.1 --port 8010"

[tasks.frontend]
description = "Start Vite dev server (foreground, http://127.0.0.1:5180)"
dir = "{{config_root}}/frontend"
run = "npm run dev -- --host 127.0.0.1 --port 5180"

# ---------------------------------------------------------------------------
# Quality / build
# ---------------------------------------------------------------------------

[tasks.test]
description = "Run backend pytest"
dir = "{{config_root}}/backend"
run = "uv run pytest -q"

[tasks.lint]
description = "Lint backend (ruff) + frontend (oxlint)"
run = [
  "mise run lint:backend",
  "mise run lint:frontend",
]

[tasks."lint:backend"]
hide = true
dir = "{{config_root}}/backend"
run = "uv run ruff check src tests"

[tasks."lint:frontend"]
hide = true
dir = "{{config_root}}/frontend"
run = "npm run lint"

[tasks.build]
description = "Production build of the frontend"
dir = "{{config_root}}/frontend"
# Unset so a leftover local URL is not inlined into the CloudFront bundle.
run = "env -u VITE_API_URL npm run build"

[tasks.check]
description = "test + lint + frontend build"
run = [
  "mise run test",
  "mise run lint",
  "mise run build",
]

# ---------------------------------------------------------------------------
# Utilities
# ---------------------------------------------------------------------------

[tasks.docs]
description = "Open API docs in the browser (API must be running)"
run = """
#!/usr/bin/env bash
set -euo pipefail
url="http://127.0.0.1:8010/docs"
if command -v open >/dev/null 2>&1; then
  open "$url"
else
  echo "$url"
fi
"""

[tasks.secrets]
description = "Print generated SECRET_KEY and TOKEN_ENCRYPTION_KEY for .env"
dir = "{{config_root}}/backend"
run = """
#!/usr/bin/env bash
set -euo pipefail
uv run python - <<'PY'
import secrets
from cryptography.fernet import Fernet
print("SECRET_KEY=" + secrets.token_urlsafe(32))
print("TOKEN_ENCRYPTION_KEY=" + Fernet.generate_key().decode())
PY
"""

# ---------------------------------------------------------------------------
# DynamoDB Local + AWS deploy
# ---------------------------------------------------------------------------

[tasks.dynamodb]
description = "Start DynamoDB Local in Docker on :8000"
run = """
#!/usr/bin/env bash
set -euo pipefail
if ! command -v docker >/dev/null 2>&1; then
  echo "docker is required for DynamoDB Local" >&2
  exit 1
fi
if lsof -ti tcp:8000 -sTCP:LISTEN >/dev/null 2>&1; then
  echo "DynamoDB Local already on :8000"
  exit 0
fi
if docker ps -a --format '{{.Names}}' | grep -q '^garmin-tracker-ddb$'; then
  docker start garmin-tracker-ddb >/dev/null
else
  docker run -d --name garmin-tracker-ddb -p 8000:8000 \
    amazon/dynamodb-local:latest -jar DynamoDBLocal.jar -sharedDb
fi
echo "DynamoDB Local http://127.0.0.1:8000"
"""

[tasks."tf:init"]
description = "terraform init in infra/"
dir = "{{config_root}}/infra"
run = "terraform init"

[tasks."tf:validate"]
description = "terraform fmt + validate"
dir = "{{config_root}}/infra"
run = "terraform fmt -check && terraform init -backend=false -input=false && terraform validate"

[tasks."deploy:image"]
description = "Build/push ARM64 Lambda image to ECR (tag = git sha or bootstrap)"
run = """
#!/usr/bin/env bash
set -euo pipefail
ROOT="{{config_root}}"
REGION="${AWS_REGION:-us-west-2}"
TAG="${LAMBDA_IMAGE_TAG:-$(git -C "$ROOT" rev-parse --short HEAD)}"
REPO_URL="$(aws ecr describe-repositories --repository-names garmin-tracker --region "$REGION" --query 'repositories[0].repositoryUri' --output text 2>/dev/null || true)"
if [[ -z "$REPO_URL" || "$REPO_URL" == "None" ]]; then
  echo "ECR repo missing — run: terraform -chdir=infra apply -target=aws_ecr_repository.api" >&2
  exit 1
fi
aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$(echo "$REPO_URL" | cut -d/ -f1)"
docker build --platform linux/arm64 --provenance=false --sbom=false \
  -t "$REPO_URL:$TAG" -t "$REPO_URL:bootstrap" "$ROOT/backend"
docker push "$REPO_URL:$TAG"
docker push "$REPO_URL:bootstrap"
aws lambda update-function-code --function-name garmin-tracker-api \
  --image-uri "$REPO_URL:$TAG" --region "$REGION" --query 'LastUpdateStatus' --output text
aws lambda update-function-code --function-name garmin-tracker-worker \
  --image-uri "$REPO_URL:$TAG" --region "$REGION" --query 'LastUpdateStatus' --output text
echo "Pushed and pointed Lambdas at $REPO_URL:$TAG"
"""

[tasks.deploy]
description = "Build SPA, push Lambda image, terraform apply, sync S3, invalidate CloudFront"
run = """
#!/usr/bin/env bash
set -euo pipefail
ROOT="{{config_root}}"
REGION="${AWS_REGION:-us-west-2}"
cd "$ROOT/frontend"
env -u VITE_API_URL npx vite build
cd "$ROOT"
mise run deploy:image
terraform -chdir="$ROOT/infra" apply -auto-approve
BUCKET="$(terraform -chdir="$ROOT/infra" output -raw frontend_bucket)"
DIST="$(terraform -chdir="$ROOT/infra" output -raw cloudfront_distribution_id)"
aws s3 sync "$ROOT/frontend/dist" "s3://$BUCKET/" --delete --region "$REGION"
aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*' >/dev/null
echo "App: $(terraform -chdir="$ROOT/infra" output -raw app_url)"
"""
